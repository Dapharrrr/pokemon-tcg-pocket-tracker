# docker-compose.dev.yml
# Usage: docker compose -f compose.dev.yml up

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pokemon_tcg_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    container_name: pokemon_tcg_app_dev
    working_dir: /app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?schema=public"
    volumes:
      # Mount source code — changes reflect immediately
      - .:/app
      # Anonymous volume for node_modules — prevents host's
      # node_modules from overriding container's
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    # Install deps, generate Prisma client, run migrations, then start dev server
    command: >
      sh -c "npm install &&
             npx prisma generate &&
             npx prisma db push &&
             npm run dev"

volumes:
  postgres_data_dev:
